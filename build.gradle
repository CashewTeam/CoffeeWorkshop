plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.2.8.1'
group = 'cn.mcmod.coffeework'
archivesBaseName = 'coffeework'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'coffeework'
            mods {
                coffeework {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'coffeework'
            mods {
                coffeework {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'coffeework'
            mods {
                coffeework {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'coffeework', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                coffeework {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "Jared's Maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'

    // 编译时使用完整 JEI（API 类在完整 jar 中）
    compileOnly fg.deobf(
            'mezz.jei:jei-1.20.1-forge:15.20.0.134'
    )

    // runClient 时加载完整 JEI
    runtimeOnly fg.deobf(
            'mezz.jei:jei-1.20.1-forge:15.20.0.134'
    )
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "Coffee Workshop",
                "Specification-Vendor"    : "MCMOD Modding Group",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "MCMOD Modding Group",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-deprecation' << '-Xlint:-removal'
}

// ── Content manifest + legacy matrix auto-generation ──────────────────
// These run after runData to keep docs/ content_manifest.json and
// docs/LEGACY_CONTENT_MATRIX.md in sync with every build.
// CI also runs them pre-build as a verification gate (build.yml).

tasks.register('updateContentManifest', Exec) {
    group = 'coffeework'
    description = 'Regenerate docs/content_manifest.json'
    workingDir = project.projectDir
    commandLine = ['python', 'tools/build_content_manifest.py']
}

tasks.register('updateLegacyMatrix', Exec) {
    group = 'coffeework'
    description = 'Regenerate docs/LEGACY_CONTENT_MATRIX.md and docs/legacy_content_matrix.json'
    workingDir = project.projectDir
    commandLine = ['python', 'tools/audit_legacy_runtime_coverage.py']
}

// Hook manifest + matrix auto-generation to run after DataGen.
// 'runData' is a lazy task created by the ForgeGradle 'minecraft.runs.data' block;
// we use afterEvaluate to ensure it exists before wiring.
afterEvaluate {
    def dataTask = tasks.findByName('runData')
    if (dataTask != null) {
        dataTask.finalizedBy 'updateContentManifest'
        dataTask.finalizedBy 'updateLegacyMatrix'
    }
}
