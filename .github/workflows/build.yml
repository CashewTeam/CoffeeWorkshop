name: Fast Build & Test

on:
  push:
    branches:
      - "1.20.1"
    paths:
      - "src/**"
      - "tools/**"
      - "docs/**"
      - "README.md"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle"
      - "gradle.properties"
      - ".github/workflows/build.yml"

  pull_request:
    branches:
      - "1.20.1"
    paths:
      - "src/**"
      - "tools/**"
      - "docs/**"
      - "README.md"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle"
      - "gradle.properties"
      - ".github/workflows/build.yml"

  workflow_dispatch:
    inputs:
      run_datagen:
        description: "运行完整 DataGen 校验"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Forge 1.20.1 Fast Build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Push 时通常足以比较上一个提交。
          # 如果一次推送包含多个提交，后面的检测脚本会单独拉取 before SHA。
          fetch-depth: 2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 覆盖 gradle.properties 中的 Windows JDK 绝对路径。
      - name: Configure Java for Gradle
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"

          echo "GRADLE_OPTS=-Dorg.gradle.java.home=$JAVA_HOME -Dorg.gradle.console=plain -Dfile.encoding=UTF-8" \
            >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # setup-gradle@v4 已包含：
      # - Gradle Wrapper 校验
      # - Gradle User Home 缓存
      # - ForgeGradle 下载依赖缓存
      # - Build Cache 缓存
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR 只读取缓存，避免未合并代码污染主分支缓存。
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # DataGen 和内容审计始终运行，确保每次提交都通过完整验证。
      - name: Detect whether DataGen is required
        id: changes
        shell: bash
        run: |
          echo "run_datagen=true" >> "$GITHUB_OUTPUT"
          echo "Run DataGen: true"

      # Python 检查很快，放在 Gradle 前面可以更早拦截资源问题。
      - name: Pre-build resource audit
        run: python tools/audit_resources.py

      - name: Content surface audit
        run: python tools/audit_content_surface.py

      - name: Legacy runtime coverage audit
        run: python tools/audit_legacy_runtime_coverage.py

      - name: Verify legacy matrix is current
        run: |
          git diff --exit-code -- docs/LEGACY_CONTENT_MATRIX.md docs/legacy_content_matrix.json || {
            echo "::error::Legacy content matrix is out of date. Run: python tools/audit_legacy_runtime_coverage.py"
            exit 1
          }

      - name: Verify manifest is current
        run: |
          python tools/build_content_manifest.py
          git diff --exit-code -- docs/CONTENT_MANIFEST.md docs/content_manifest.json || {
            echo "::error::Content manifest is out of date. Run: python tools/build_content_manifest.py"
            exit 1
          }

      # 只有一次 Gradle 启动。
      #
      # 普通构建：
      #   build
      #
      # 完整构建：
      #   runData build
      - name: Build mod
        shell: bash
        env:
          RUN_DATAGEN: ${{ steps.changes.outputs.run_datagen }}
        run: |
          set -euo pipefail

          if [[ "$RUN_DATAGEN" == "true" ]]; then
            echo "Running full DataGen and build..."

            ./gradlew \
              runData \
              build \
              --build-cache \
              --stacktrace \
              --console=plain
          else
            echo "No DataGen-related changes detected."
            echo "Running build only..."

            ./gradlew \
              build \
              --build-cache \
              --stacktrace \
              --console=plain
          fi

      # 仅在实际运行 DataGen 后检查生成目录。
      - name: Verify generated resources
        if: steps.changes.outputs.run_datagen == 'true'
        shell: bash
        run: |
          set -euo pipefail

          GENERATED_CHANGES="$(
            git status \
              --porcelain \
              --untracked-files=all \
              -- src/generated/resources
          )"

          if [[ -n "$GENERATED_CHANGES" ]]; then
            echo "::error::DataGen generated uncommitted changes."
            echo
            echo "Changed files:"
            echo "$GENERATED_CHANGES"
            echo
            echo "Tracked diff:"
            git diff -- src/generated/resources || true
            echo
            echo "Please run locally:"
            echo "  ./gradlew runData"
            echo "Then commit the generated resources."
            exit 1
          fi

          echo "Generated resources are up to date."

      # 检查 DataGen 生成后的最终资源状态。
      - name: Post-DataGen resource audit
        if: steps.changes.outputs.run_datagen == 'true'
        run: python tools/audit_resources.py

      # Phase 2: GameTest server regression
      - name: Run GameTest server
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            runGameTestServer \
            --build-cache \
            --stacktrace \
            --console=plain

      # Phase 3: Recipe reachability check
      - name: Check recipe reachability
        shell: bash
        run: python tools/report_recipe_reachability.py

      - name: Upload reachability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-reachability-${{ github.run_number }}
          path: build/reports/coffeework/recipe-reachability.md
          if-no-files-found: ignore
          retention-days: 7

      - name: List build outputs
        if: success()
        shell: bash
        run: |
          echo "Generated JAR files:"
          find build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coffeework-1.20.1-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            build/reports/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 7