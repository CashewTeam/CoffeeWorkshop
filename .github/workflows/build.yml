# Coffee Workshop — CI Build & Test
#
# Phase 0 baseline: compileJava, runData (idempotency check),
# resource audit, and build.
#
# Runs on every push and pull request to the 1.20.1 branch.

name: Build & Test

on:
  push:
    branches: [ "1.20.1", "master" ]
  pull_request:
    branches: [ "1.20.1", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 1: Compile Java sources
      - name: Compile Java
        run: ./gradlew compileJava --no-daemon

      # Step 2: Run Data Generation
      - name: Run Data Generation
        run: ./gradlew runData --no-daemon

      # Step 3: Verify generated resources are up-to-date (no uncommitted changes)
      - name: Check Generated Resources
        run: |
          if ! git diff --stat --exit-code src/generated/; then
            echo "ERROR: runData produced changes not committed."
            echo "Run ./gradlew runData locally and commit the results."
            git diff src/generated/
            exit 1
          fi

      # Step 4: Resource audit
      - name: Resource Audit
        run: python tools/audit_resources.py

      # Step 5: Build JAR
      - name: Build
        run: ./gradlew build --no-daemon

      # Step 6: Archive build reports
      - name: Archive Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/
            build/libs/*.jar
          retention-days: 7
