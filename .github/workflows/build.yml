name: Fast Build & Test

on:
  push:
    branches:
      - "1.20.1"
    paths:
      - "src/**"
      - "tools/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle"
      - "gradle.properties"
      - ".github/workflows/build.yml"

  pull_request:
    branches:
      - "1.20.1"
    paths:
      - "src/**"
      - "tools/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle"
      - "gradle.properties"
      - ".github/workflows/build.yml"

  workflow_dispatch:
    inputs:
      run_datagen:
        description: "运行完整 DataGen 校验"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Forge 1.20.1 Fast Build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Push 时通常足以比较上一个提交。
          # 如果一次推送包含多个提交，后面的检测脚本会单独拉取 before SHA。
          fetch-depth: 2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 覆盖 gradle.properties 中的 Windows JDK 绝对路径。
      - name: Configure Java for Gradle
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"

          echo "GRADLE_OPTS=-Dorg.gradle.java.home=$JAVA_HOME -Dorg.gradle.console=plain -Dfile.encoding=UTF-8" \
            >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # setup-gradle@v4 已包含：
      # - Gradle Wrapper 校验
      # - Gradle User Home 缓存
      # - ForgeGradle 下载依赖缓存
      # - Build Cache 缓存
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR 只读取缓存，避免未合并代码污染主分支缓存。
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # PR 始终跑完整 DataGen。
      # Push 只有修改到 DataGen 相关文件时才跑。
      - name: Detect whether DataGen is required
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_DATAGEN: ${{ inputs.run_datagen }}
        run: |
          set -euo pipefail

          RUN_DATAGEN=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # 合并前始终进行完整的数据生成验收。
            RUN_DATAGEN=true

          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # 手动运行时由输入选项决定。
            RUN_DATAGEN="${MANUAL_DATAGEN:-true}"

          elif [[ "$EVENT_NAME" == "push" ]]; then
            # 新建分支或历史不完整时，保守地执行 DataGen。
            if [[ -z "${BEFORE_SHA:-}" ]] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              RUN_DATAGEN=true
            else
              # 一次推送可能包含多个提交，确保 before SHA 可供比较。
              if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                git fetch \
                  --no-tags \
                  --depth=1 \
                  origin "$BEFORE_SHA"
              fi

              CHANGED_FILES="$(
                git diff \
                  --name-only \
                  "$BEFORE_SHA" \
                  "$GITHUB_SHA"
              )"

              echo "Changed files:"
              echo "$CHANGED_FILES"

              # 这些文件可能改变生成的 Recipe、Loot Table、
              # Advancement、Tag 或其他 DataGen 输出。
              if grep -Eq \
                '^(src/main/java/net/langball/coffee/datagen/|src/main/java/net/langball/coffee/init/|src/main/java/net/langball/coffee/block/BlockCoffeeTree\.java$|src/main/java/net/langball/coffee/block/BlockVanilla\.java$|src/generated/resources/|src/main/resources/data/|build\.gradle$|settings\.gradle$|gradle\.properties$)' \
                <<< "$CHANGED_FILES"; then
                RUN_DATAGEN=true
              fi
            fi
          fi

          echo "run_datagen=$RUN_DATAGEN" >> "$GITHUB_OUTPUT"
          echo "Run DataGen: $RUN_DATAGEN"

      # Python 检查很快，放在 Gradle 前面可以更早拦截资源问题。
      - name: Pre-build resource audit
        run: python tools/audit_resources.py

      # 只有一次 Gradle 启动。
      #
      # 普通构建：
      #   build
      #
      # 完整构建：
      #   runData build
      - name: Build mod
        shell: bash
        env:
          RUN_DATAGEN: ${{ steps.changes.outputs.run_datagen }}
        run: |
          set -euo pipefail

          if [[ "$RUN_DATAGEN" == "true" ]]; then
            echo "Running full DataGen and build..."

            ./gradlew \
              runData \
              build \
              --build-cache \
              --stacktrace \
              --console=plain
          else
            echo "No DataGen-related changes detected."
            echo "Running build only..."

            ./gradlew \
              build \
              --build-cache \
              --stacktrace \
              --console=plain
          fi

      # 仅在实际运行 DataGen 后检查生成目录。
      - name: Verify generated resources
        if: steps.changes.outputs.run_datagen == 'true'
        shell: bash
        run: |
          set -euo pipefail

          GENERATED_CHANGES="$(
            git status \
              --porcelain \
              --untracked-files=all \
              -- src/generated/resources
          )"

          if [[ -n "$GENERATED_CHANGES" ]]; then
            echo "::error::DataGen generated uncommitted changes."
            echo
            echo "Changed files:"
            echo "$GENERATED_CHANGES"
            echo
            echo "Tracked diff:"
            git diff -- src/generated/resources || true
            echo
            echo "Please run locally:"
            echo "  ./gradlew runData"
            echo "Then commit the generated resources."
            exit 1
          fi

          echo "Generated resources are up to date."

      # 检查 DataGen 生成后的最终资源状态。
      - name: Post-DataGen resource audit
        if: steps.changes.outputs.run_datagen == 'true'
        run: python tools/audit_resources.py

      # Phase 2: GameTest server regression
      - name: Run GameTest server
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            runGameTestServer \
            --build-cache \
            --stacktrace \
            --console=plain

      # Phase 3: Recipe reachability check
      - name: Check recipe reachability
        shell: bash
        run: python tools/report_recipe_reachability.py

      - name: Upload reachability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-reachability-${{ github.run_number }}
          path: build/reports/coffeework/recipe-reachability.md
          if-no-files-found: ignore
          retention-days: 7

      - name: List build outputs
        if: success()
        shell: bash
        run: |
          echo "Generated JAR files:"
          find build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coffeework-1.20.1-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            build/reports/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 7