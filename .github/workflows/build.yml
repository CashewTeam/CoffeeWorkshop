name: Build & Test

on:
  push:
    branches:
      - "1.20.1"

  pull_request:
    branches:
      - "1.20.1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Forge 1.20.1 Build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-java 会设置适用于当前 Linux Runner 的 JAVA_HOME。
      # 这里通过 GRADLE_OPTS 覆盖项目 gradle.properties 中的 Windows 路径。
      - name: Configure Java environment for Gradle
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_HOME_17_X64=$JAVA_HOME"

          echo "GRADLE_OPTS=-Dorg.gradle.java.home=$JAVA_HOME -Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dfile.encoding=UTF-8" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show build environment
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "GRADLE_OPTS=$GRADLE_OPTS"
          java -version
          python --version
          ./gradlew --version

      - name: Compile Java
        run: ./gradlew compileJava --no-daemon --stacktrace

      - name: Run DataGen
        run: ./gradlew runData --no-daemon --stacktrace

      - name: Verify generated resources
        shell: bash
        run: |
          echo "Checking src/generated/resources..."

          GENERATED_CHANGES="$(
            git status \
              --porcelain \
              --untracked-files=all \
              -- src/generated/resources
          )"

          if [[ -n "$GENERATED_CHANGES" ]]; then
            echo "::error::DataGen generated changes that are not committed."
            echo
            echo "Changed or untracked generated files:"
            echo "$GENERATED_CHANGES"
            echo
            echo "Tracked file diff:"
            git diff -- src/generated/resources || true
            echo
            echo "Please run locally:"
            echo "  ./gradlew runData"
            echo "Then commit the generated changes."
            exit 1
          fi

          echo "Generated resources are up to date."

      - name: Audit resources
        run: python tools/audit_resources.py

      - name: Build mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: List build outputs
        if: success()
        run: |
          echo "Generated JAR files:"
          find build/libs -maxdepth 1 -type f -name "*.jar" -print

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coffeework-1.20.1-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            build/reports/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 14